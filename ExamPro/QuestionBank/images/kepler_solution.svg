<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" style="background:#ffffff">
  <rect x="30" y="30" width="540" height="340" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="170" y="70" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0f172a">Gravitation &amp; Kepler's Laws</text>
  <text x="70" y="130" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2563eb">Universal Gravity: F = G * M * m / r²</text>
  <text x="70" y="180" font-family="sans-serif" font-size="16" font-weight="bold" fill="#dc2626">Kepler's 3rd Law: T² = (4π² / GM) * a³</text>
  <text x="70" y="230" font-family="sans-serif" font-size="16" font-weight="bold" fill="#16a34a">Escape Velocity: v_e = √(2 GM / R) = √(2 g R)</text>
  <rect x="60" y="270" width="480" height="70" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="80" y="300" font-family="sans-serif" font-size="14" fill="#1e3a8a">Orbital Velocity: v_o = √(GM / r)</text>
  <text x="80" y="325" font-family="sans-serif" font-size="14" fill="#1e3a8a">Total Orbital Energy: E = -GMm / (2r)</text>
</svg>