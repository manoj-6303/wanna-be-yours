<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" style="background:#ffffff">
  <rect x="30" y="30" width="540" height="340" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="170" y="70" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0f172a">Variation of Acceleration 'g'</text>
  <text x="70" y="130" font-family="sans-serif" font-size="16" font-weight="bold" fill="#2563eb">At height h: g(h) = g * (1 - 2h / R) (for h &lt;&lt; R)</text>
  <text x="70" y="180" font-family="sans-serif" font-size="16" font-weight="bold" fill="#dc2626">At depth d: g(d) = g * (1 - d / R)</text>
  <text x="70" y="230" font-family="sans-serif" font-size="16" font-weight="bold" fill="#16a34a">Due to Latitude λ: g' = g - ω² R cos² λ</text>
  <rect x="60" y="270" width="480" height="70" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="2"/>
  <text x="80" y="300" font-family="sans-serif" font-size="14" font-weight="bold" fill="#92400e">At Earth's Center (d = R): g_center = 0</text>
  <text x="80" y="325" font-family="sans-serif" font-size="14" fill="#92400e">Gravitational Potential inside Earth: V(r) = -GM (3R² - r²) / (2 R³)</text>
</svg>